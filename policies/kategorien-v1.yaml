# Kategoriesystem der ParlamentPlattform — Version 1 (F-45, ADR-007).
#
# Zweck: Jeder Antrag wird einem oder mehreren LEBENSBEREICHEN zugeordnet.
# Mitglieder abonnieren Lebensbereiche (Bereich a des Hauptfensters) und
# werden informiert, wenn dort Neues eingebracht wird (F-46).
#
# Aufbau: Zwei Ebenen.
#   Ebene 1 (diese Datei): ~24 bürgernahe DDÖ-Lebensbereiche — vollständig,
#     verständlich, stabil. Sie sind das, was Menschen sehen und abonnieren.
#   Ebene 2 (späterer Import): EuroVoc, der mehrsprachige Thesaurus des
#     EU-Amts für Veröffentlichungen (21 Domänen, 127 Mikrothesauri,
#     ~7.400 Deskriptoren, Deutsch inklusive, maschinenlesbar als SKOS).
#     Jeder Lebensbereich nennt unten seine EuroVoc-Domänen — damit sind
#     Feinverschlagwortung, RIS/EUR-Lex-Anschluss (Folgenabschätzung!) und
#     Mehrsprachigkeit vorbereitet, ohne dass Mitglieder durch tausende
#     Begriffe navigieren müssen.
#
# Weiterentwicklung: Diese Datei ist versioniert. Änderungen (neue Bereiche,
# Umbenennungen, Zusammenlegungen) erscheinen als neue Version im Repository
# samt CHANGELOG; bestehende Zuordnungen bleiben erhalten (Slugs sind stabil).
# Kein Bereich „Sonstiges“: Was nirgends passt, ist ein Signal, das System
# weiterzuentwickeln — nicht, es in eine Restablage zu kippen.

