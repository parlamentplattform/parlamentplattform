[project]
name = "parlamentplattform"
version = "0.39.7"
description = "Offene Beteiligungs- und Entscheidungsinfrastruktur der Direkte Demokratie Österreich (DDÖ)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Direkte Demokratie Österreich", email = "didide@ddoe.at" }]
dependencies = [
    "Django>=5.0,<5.3",
    "PyYAML>=6.0",
    "segno>=1.6",
    "requests>=2.31",  # F-59: Kontoinformationsdienst-Abrufe (mitglieder/bank.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "coverage[toml]>=7.4",
]
e2e = [
    "playwright>=1.47",       # Bildschirmtests, laut CLAUDE.md ohne ADR zulässig
    "pytest-playwright>=0.5",
]
postgres = ["psycopg[binary]>=3.1"]
prod = ["gunicorn>=22.0", "whitenoise>=6.6"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests", "verfahren", "mitglieder", "uebersicht", "plattform_core", "anstoss", "mandatare", "gremien", "ki", "parameter"]
python_files = ["test_*.py", "tests.py"]
markers = ["e2e: Bildschirmtests mit Playwright und Chromium (tests/e2e)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.coverage.run]
source = ["plattform_core"]
branch = true
omit = ["*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plattform_core"]
