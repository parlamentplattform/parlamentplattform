name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Statische Prüfung (ruff)
        run: ruff check .
      - name: Tests mit Kern-Abdeckung ≥ 90 %
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Django-Systemcheck
        run: python manage.py check
