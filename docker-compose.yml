# Entwicklungs-Setup: `docker compose up` startet Datenbank und Plattform.
# Produktion bekommt in Phase 2 ein eigenes Compose mit Caddy, Backups und
# Keycloak — siehe docs/CONCEPT.md, Abschnitt Betrieb.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plattform
      POSTGRES_USER: plattform
      POSTGRES_PASSWORD: nur-entwicklung
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plattform"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: plattform
      POSTGRES_USER: plattform
      POSTGRES_PASSWORD: nur-entwicklung
      DDOE_DEBUG: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
