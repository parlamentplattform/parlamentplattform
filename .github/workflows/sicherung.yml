name: Sicherung

# Export innerhalb von Render; keine Datenbankadresse und keine Datenbankfreigabe bei GitHub.
# Einmal pro Monat die fertige Kopie unabhängig kontrollieren und wiederherstellen (ADR-013).
on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicherung-probe
  cancel-in-progress: false

env:
  ZIEL: parlamentplattform/sicherung

jobs:
  kontrolle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Monatssicherung im Render-Dienst bestätigt?
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            https://parlament.ddoe.at/sicherung/status.json

  probe:
    needs: kontrolle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: probe
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: probe
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[prod,postgres]"
      - name: PostgreSQL-Werkzeuge
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Token vorhanden?
        env:
          GH_TOKEN: ${{ secrets.DDOE_SICHERUNG_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::DDOE_SICHERUNG_TOKEN fehlt für die Wiederherstellungsprobe."; exit 1; }
      - name: Jüngste private Sicherung holen
        env:
          GH_TOKEN: ${{ secrets.DDOE_SICHERUNG_TOKEN }}
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$ZIEL" --jq .private)" = true ] || { echo "::error::Sicherungsrepository ist nicht privat."; exit 1; }
          tag=$(gh release list --repo "$ZIEL" --limit 1 --json tagName --jq '.[0].tagName')
          [[ "$tag" =~ ^ddoe-sicherung-$(date -u +%Y-%m)-[0-9]{2}T[0-9]{4}([0-9]{2})?Z$ ]] || { echo "::error::Keine Sicherung dieses Monats."; exit 1; }
          gh release download "$tag" --repo "$ZIEL" --dir probe
          echo "SICHERUNG=probe/$tag.dump" >> "$GITHUB_ENV"
      - name: Zurückspielen und prüfen (Migrationen, Audit-Kette)
        run: |
          tools/sicherung.sh probe "$SICHERUNG"
          echo "### Wiederherstellungsprobe bestanden: $(basename "$SICHERUNG")" >> "$GITHUB_STEP_SUMMARY"
